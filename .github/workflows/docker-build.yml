
name: Docker Build and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build, scan and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t petclinic:ci -f Dockerfile .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.76.1
          cache: true

      - name: Verify Docker image
        run: docker image inspect petclinic:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: petclinic:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'
          skip-setup-trivy: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: sadokslamaesprit/devops26
        run: |
          docker tag petclinic:ci "$IMAGE_NAME:$GITHUB_SHA"
          docker tag petclinic:ci "$IMAGE_NAME:latest"

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: sadokslamaesprit/devops26
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy PetClinic with Ansible
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 15

    steps:
      - name: Verify deployment environment
        run: |
          echo "Deploying commit: $GITHUB_SHA"
          whoami
          docker --version
          ansible --version

      - name: Deploy PetClinic
        run: |
          ansible-playbook /home/sadok/devops26/ansible/deploy-petclinic.yml \
            --extra-vars "deploy_tag=$GITHUB_SHA"


      - name: Verify PetClinic HTTP response
        run: |
          for attempt in {1..18}; do
            echo "Health check attempt $attempt/18"

            if curl --fail --silent --show-error \
              --max-time 10 \
              http://localhost:8082/; then
              echo "PetClinic is responding successfully."
              exit 0
            fi

            sleep 5
          done

          echo "PetClinic did not become available in time."
          docker compose -f /home/sadok/devops26/docker-compose.yml ps
          docker compose -f /home/sadok/devops26/docker-compose.yml logs --tail=100 petclinic
          exit 1
      
